<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid System</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="dash">
    <header class="dash-head">
      <img src="/assets/microgrid-optimizer.png" alt="MicroGridOptimizer" width="720" height="415">
      <button class="ghost" id="signout" type="button">Sign out</button>
    </header>
    <h1 id="welcome">Welcome</h1>
    <p class="sub">You’re signed in to Grid System.</p>
    <dl class="facts">
      <dt>Name</dt><dd id="f-name"></dd>
      <dt>Username</dt><dd id="f-username"></dd>
      <dt>Email</dt><dd id="f-email"></dd>
      <dt>Account created</dt><dd id="f-created"></dd>
    </dl>
  </main>
  <script src="/dashboard.js"></script>
</body>
</html>
